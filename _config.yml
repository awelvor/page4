baseurl: "page4"
url: "https://awelvor.github.io/page4/"

collections:
  authors:
    output: true
defaults:
  - scope:
      path: "assets"
    values:
      image: true
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

